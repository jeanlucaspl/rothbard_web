<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia Murray Rothbard — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --teal:#2D5A56;--teal-dark:#1A3835;--teal-light:#4A8078;
      --cream:#F3EDD8;--cream-dark:#E4D9B4;
      --text:#1C2B29;--muted:#637875;
      --white:#FAFAF8;--border:rgba(45,90,86,.15);
    }
    body{background:var(--cream);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .wrap{width:100%;max-width:420px;text-align:center}
    .logo{width:min(280px,70vw);height:min(280px,70vw);object-fit:contain;margin:0 auto 16px;filter:drop-shadow(0 4px 20px rgba(45,90,86,.25))}
    h1{font-family:'Playfair Display',serif;font-size:clamp(18px,5vw,24px);color:var(--teal-dark);margin-bottom:4px}
    .lema{font-size:clamp(10px,2.8vw,12px);letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
    .card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:clamp(20px,6vw,32px);box-shadow:0 4px 24px rgba(45,90,86,.08)}
    label{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;text-align:left}
    input{width:100%;padding:clamp(11px,3vw,14px) 16px;border:1.5px solid var(--border);border-radius:8px;font-size:clamp(16px,4.5vw,18px);font-family:'Inter',sans-serif;letter-spacing:.2em;color:var(--text);background:var(--cream);outline:none;transition:border-color .2s;text-align:center}
    input:focus{border-color:var(--teal)}
    button{width:100%;margin-top:14px;padding:clamp(12px,3.5vw,14px);background:var(--teal);color:var(--white);border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:clamp(14px,4vw,15px);font-weight:600;cursor:pointer;letter-spacing:.04em;transition:background .2s}
    button:hover{background:var(--teal-dark)}
    .error{margin-top:12px;font-size:13px;color:#C0392B;min-height:18px}
    .btn-wa{width:100%;margin-top:10px;padding:clamp(11px,3vw,13px);background:#25D366;color:#fff;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:clamp(13px,3.8vw,14px);font-weight:600;cursor:pointer;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
    .btn-wa:hover{background:#1dbb5a}
    .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .footer{margin-top:20px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
    /* pantallas muy pequeñas (< 360px) */
    @media(max-width:360px){
      body{padding:10px}
      .logo{width:60vw;height:60vw}
      .card{padding:18px}
    }
    /* tablets y pantallas medianas */
    @media(min-width:480px){
      .logo{width:260px;height:260px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <img src="logo.png" alt="Academia Murray Rothbard" class="logo">
  <h1>Academia Murray Rothbard</h1>
  <p class="lema">Libertas Ex Scientia · Tarapoto</p>
  <div class="card">
    <label>Ingrese su DNI</label>
    <input type="number" id="dni" maxlength="8" placeholder="00000000" autofocus>
    <button onclick="login()">Ingresar</button>
    <p class="error" id="err"></p>
    <div class="divider">¿No estás registrado?</div>
    <button class="btn-wa" onclick="solicitarInfo()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Solicitar información
    </button>
  </div>
  <p class="footer">© 2026 Academia Murray Rothbard</p>
</div>
<script>
  const ADMIN_DNI = '48240305';
  const DB_KEY = 'rothbard_db';
  const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const HOURS = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'];

  function getDB() {
    const def = {
      padres:[], hijos:[], cursos:[],
      horario_disponible:{Lunes:[],Martes:[],Miércoles:[],Jueves:[],Viernes:[],Sábado:[],Domingo:[]},
      horarios_asignados:[], clases:[], notas:[]
    };
    try { return Object.assign(def, JSON.parse(localStorage.getItem(DB_KEY)) || {}); }
    catch { return def; }
  }

  function login() {
    const dni = String(document.getElementById('dni').value).trim();
    if (!dni) return;
    if (dni === ADMIN_DNI) {
      sessionStorage.setItem('auth', JSON.stringify({type:'admin'}));
      location.href = 'admin.html';
      return;
    }
    const db = getDB();
    const padre = db.padres.find(p => p.dni === dni);
    if (padre) {
      sessionStorage.setItem('auth', JSON.stringify({type:'padre', id:padre.id}));
      location.href = 'padre.html';
      return;
    }
    document.getElementById('err').textContent = 'DNI no encontrado. Consulte con el profesor.';
  }

  document.getElementById('dni').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  function solicitarInfo() {
    const msg = encodeURIComponent('Hola, me interesa obtener información sobre la Academia Murray Rothbard. ¿Me podría brindar más detalles sobre los cursos y horarios disponibles?');
    window.open('https://wa.me/51994240515?text=' + msg, '_blank');
  }
</script>
</body>
</html>
